name: Build Windows exe

# Không có máy Windows thì bấm Run workflow ở tab Actions, tải .exe ở mục Artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dựng runtime + đóng gói
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dola-studio-windows
          path: dist-app/*.exe
          if-no-files-found: error
