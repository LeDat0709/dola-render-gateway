name: Build Windows exe

# Không có máy Windows thì bấm Run workflow ở tab Actions, tải .exe ở mục Artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write          # cần để đính .exe vào Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Tên file .exe lấy số từ desktop/package.json; đẩy tag v1.0.4 thì ghi 1.0.4 vào đó trước khi
      # đóng gói, khỏi ra "Setup 1.0.0.exe" cho mọi bản (chỉ sửa trên máy CI, không commit).
      - name: Lấy số phiên bản từ tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: npm --prefix desktop version --no-git-tag-version --allow-same-version ($env:GITHUB_REF_NAME.TrimStart('v'))
      - name: Dựng runtime + đóng gói
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dola-studio-windows
          path: |
            dist-app/*.exe
            dist-app/latest.yml
            dist-app/*.blockmap
          if-no-files-found: error

      # Đẩy tag v* (ví dụ: git tag v1.0.0 && git push mine v1.0.0) thì .exe tự lên Releases,
      # tải một cú bấm, không cần vào tab Actions. Mac chạy song song và có thể tạo Release trước ->
      # tạo không được thì upload vào Release có sẵn (--clobber ghi đè nếu trùng tên).
      # latest.yml + *.blockmap: electron-updater đọc để TỰ CẬP NHẬT bản đã cài (NSIS) — thiếu là không auto-update được.
      - name: Đính .exe + metadata auto-update vào Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Gom file bằng MẢNG (giữ được dấu cách trong "Dola Studio Setup x.exe") + bỏ qua file thiếu.
          # Trước đây FILES=$(ls ...) rồi $FILES không nháy → tên có dấu cách bị tách → gh lỗi.
          shopt -s nullglob
          FILES=(dist-app/*.exe)
          [ -f dist-app/latest.yml ] && FILES+=(dist-app/latest.yml)
          FILES+=(dist-app/*.blockmap)
          echo "Đính ${#FILES[@]} file:"; printf ' - %s\n' "${FILES[@]}"
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dola Studio $GITHUB_REF_NAME" \
            --notes "Bản Windows một-cú-bấm. Tải **Dola Studio Setup** để cài (bản cài TỰ CẬP NHẬT các phiên bản sau), hoặc **DolaStudio-portable** để chạy thẳng. Máy đích không cần cài Python/Node/Chrome." \
          || gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
