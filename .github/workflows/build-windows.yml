name: Build Windows exe

# Không có máy Windows thì bấm Run workflow ở tab Actions, tải .exe ở mục Artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write          # cần để đính .exe vào Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dựng runtime + đóng gói
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dola-studio-windows
          path: dist-app/*.exe
          if-no-files-found: error

      # Đẩy tag v* (ví dụ: git tag v1.0.0 && git push mine v1.0.0) thì .exe tự lên Releases,
      # tải một cú bấm, không cần vào tab Actions.
      - name: Đính .exe vào Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-app/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dola Studio $GITHUB_REF_NAME" \
            --notes "Bản Windows một-cú-bấm. Tải **Dola Studio Setup** để cài, hoặc **DolaStudio-portable** để chạy thẳng. Máy đích không cần cài Python/Node/Chrome."
